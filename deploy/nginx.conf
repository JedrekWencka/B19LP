server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;     # /pl -> /pl/ stays on https behind the proxy

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # audio: correct type for FLAC (not in nginx's default list), long cache, range requests
    location ~* \.flac$ {
        types { }
        default_type audio/flac;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.mp3$ {
        types { }
        default_type audio/mpeg;
        expires 7d;
        add_header Cache-Control "public";
    }

    # code: browsers always re-check with the server (cheap 304 if unchanged),
    # so a git pull shows up immediately for every visitor
    location ~* \.(html|css|js|xml|txt)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location /pl/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /pl/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
