# The same file in every landing-page repo. site.sh copies it to /opt/<name>/ on the server
# and writes the .env next to it (container name, the edge network, the preview port).
# Production containers have no public port: ww-landing (ports 80/443) proxies the domain
# to them by container name over its Docker network.
services:
  web:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER:?set by site.sh}
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks: [edge]

networks:
  edge:
    external: true
    name: ${WW_NETWORK:-ww_landing_default}
