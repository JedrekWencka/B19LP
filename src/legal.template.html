<!doctype html>
<!-- GENERATED by tools/build.py from src/privacy.template.html + src/privacy.json — edit those, not this file. -->
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="en" href="{{url_en}}">
  <link rel="alternate" hreflang="pl" href="{{url_pl}}">
  <link rel="alternate" hreflang="x-default" href="{{url_en}}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v={{v}}">
</head>
<body class="legal-page">
<a class="skip-link mono" href="#content">{{skip_link}}</a>

<header class="legal-header mono">
  <a class="logo" href="{{home}}">B19 <span aria-hidden="true">©</span></a>
  <div class="lang-switch" aria-label="{{aria_language}}">{{lang_switch}}</div>
</header>

<main class="legal" id="content">
  <a class="legal-back mono" href="{{home}}">{{back}}</a>
  <h1 class="mono">{{heading}}</h1>
  <p class="legal-updated mono">{{updated_label}}: {{updated}}</p>
  <p class="legal-intro">{{intro}}</p>
{{sections_html}}
{{bottom_link}}</main>

<footer class="footer mono legal-footer">
  <span>© <span data-year>2026</span> B19 · JĘDRZEJ WENCKA</span>
  <span class="footer-legal"><a href="{{privacy_url}}" class="footer-cookies">{{privacy_link}}</a><a href="{{a11y_url}}" class="footer-cookies">{{a11y_link}}</a><a href="#" class="footer-cookies" data-consent-open>{{cookie_link}}</a></span>
</footer>

<!-- ============ COOKIE CONSENT (see js/consent.js) ============ -->
<div class="consent mono" data-consent role="dialog" aria-live="polite" aria-label="{{cookie_aria}}" hidden>
  <p class="consent-head"><span class="rec-dot live" aria-hidden="true"></span>{{cookie_head}}</p>
  <p class="consent-text">{{cookie_text}} <a href="{{privacy_url}}">{{cookie_more}}</a></p>
  <div class="consent-btns">
    <button type="button" class="consent-accept" data-consent-accept>{{cookie_accept}}</button>
    <button type="button" class="consent-reject" data-consent-reject>{{cookie_reject}}</button>
  </div>
</div>

<script src="/js/consent.js?v={{v}}"></script>
<script>document.querySelectorAll("[data-year]").forEach(function (e) { e.textContent = new Date().getFullYear(); });</script>
</body>
</html>
